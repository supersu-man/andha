name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build & Release AAB
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Match Version Tag in Commit Message
        id: regex-match
        uses: kaisugi/action-regex-match@v1.0.2
        with:
          text: ${{ github.event.head_commit.message }}
          regex: '^v[0-9]+\.[0-9]+$'

      - name: Setup JDK 17
        if: steps.regex-match.outputs.match != ''
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        if: steps.regex-match.outputs.match != ''
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        if: steps.regex-match.outputs.match != ''
        run: chmod +x gradlew

      - name: Build Release AAB
        if: steps.regex-match.outputs.match != ''
        run: ./gradlew bundleRelease --stacktrace

      - name: Prepare AAB for Signing
        if: steps.regex-match.outputs.match != ''
        run: |
          mkdir -p app/build/outputs
          if [ -f "app/build/outputs/bundle/release/app-release-unsigned.aab" ]; then
            mv app/build/outputs/bundle/release/app-release-unsigned.aab app/build/outputs/app-release.aab
          elif [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/app-release.aab
          fi

      - name: Sign Android Release AAB
        if: steps.regex-match.outputs.match != ''
        id: sign_app
        uses: ilharp/sign-android-release@v2
        with:
          buildToolsVersion: 36.0.0
          releaseDir: app/build/outputs
          signingKey: ${{ secrets.SIGNINGKEYBASE64 }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTOREPASSWORD }}
          keyPassword: ${{ secrets.KEYPASSWORD }}

      - name: Build Changelog
        if: steps.regex-match.outputs.match != ''
        id: changelog
        uses: ardalanamini/auto-changelog@v5
        with:
          mention-authors: false
          mention-new-contributors: false
          include-compare: false
          semver: false

      - name: Create GitHub Release
        if: steps.regex-match.outputs.match != ''
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/app-release-signed.aab"
          body: ${{ steps.changelog.outputs.changelog }}
          tag: ${{ steps.regex-match.outputs.match }}
          name: Release ${{ steps.regex-match.outputs.match }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Signed AAB Artifact
        if: steps.regex-match.outputs.match != ''
        uses: actions/upload-artifact@v7
        with:
          name: app-release-signed
          path: app/build/outputs/app-release-signed.aab
          retention-days: 7
